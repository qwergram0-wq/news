# 2시간마다 Supabase의 collect-news 함수를 호출해 새 뉴스를 수집한다.
# 필요한 Secrets (저장소 Settings → Secrets and variables → Actions):
#   SUPABASE_URL              예: https://xxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  publishable key (sb_publishable_...)  ※ secret / service_role 키는 넣지 않는다
name: collect-news

on:
  schedule:
    - cron: "0 */2 * * *"   # UTC 기준 2시간마다 (실제 실행은 몇 분 늦어질 수 있음)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call collect-news
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "Secrets가 설정되지 않았습니다"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST "$SUPABASE_URL/functions/v1/collect-news" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
